<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PaperPulse — Academic research, curated daily.">
  <meta name="theme-color" content="#F5F0E8">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PaperPulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>PaperPulse</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F5F0E8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: opacity 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-wordmark {
      font-size: 32px;
      font-weight: 700;
      color: #1A1A1A;
      letter-spacing: -0.5px;
    }

    #loading-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #D4D0C8;
      border-top-color: #4A7C59;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-wordmark">PaperPulse</div>
    <div id="loading-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
