name: paperpulse_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.2.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.11.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.2
  lottie: ^3.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.12.0
  syncfusion_flutter_pdf: ^32.2.5
  syncfusion_flutter_pdfviewer: ^32.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/

  fonts:
    - family: DreamOrphans
      fonts:
        - asset: "assets/fonts/dream_orphans/Dream Orphans.otf"
        - asset: "assets/fonts/dream_orphans/Dream Orphans Bd.otf"
          weight: 700
        - asset: "assets/fonts/dream_orphans/Dream Orphans It.otf"
          style: italic
        - asset: "assets/fonts/dream_orphans/Dream Orphans Bd It.otf"
          weight: 700
          style: italic
